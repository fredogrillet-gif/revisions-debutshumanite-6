<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Révisions 6e – Les débuts de l’humanité et la révolution néolithique</title>
<style>
:root{--n:#1b2a4a;--g:#f2b632;--b:#f6efe0;--v:#6aa621;--c:#fffdf7}
*{box-sizing:border-box}
body{margin:0;background:var(--b);color:var(--n);font:17px/1.5 "Trebuchet MS","Segoe UI",sans-serif}
header{background:var(--n);text-align:center;padding:14px;border-bottom:6px solid var(--g)}
header img{height:150px;max-width:100%;object-fit:contain;background:#fff;border-radius:18px;padding:6px}
main{max-width:780px;margin:0 auto;padding:16px}
.card{background:var(--c);border:3px solid var(--n);border-radius:16px;padding:18px;box-shadow:6px 6px 0 var(--g)}
h1{font-size:1.5rem;margin:.2em 0}h2{margin:.2em 0 .6em}
.path{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.stp{flex:1;min-width:88px;text-align:center;font-size:13px;padding:6px;border-radius:12px;background:#e7dcc3;border:2px solid transparent}
.stp.on{border-color:var(--n);background:var(--g);font-weight:700}.stp.ok{background:#cfe8a9}
button{font:inherit;cursor:pointer;border:2px solid var(--n);background:#fff;color:var(--n);border-radius:12px;padding:8px 14px;margin:4px 4px 4px 0}
button:hover{background:var(--g)}button.pri{background:var(--n);color:#fff}button.pri:hover{background:#2c4373}
.opt{display:block;width:100%;text-align:left}
.good{background:#cfe8a9!important}.bad{background:#f6c7c4!important}
select,input{font:inherit;padding:6px;border-radius:8px;border:2px solid var(--n);max-width:100%}
textarea{width:100%;min-height:160px;font:inherit;padding:10px;border:2px solid var(--n);border-radius:10px;margin:8px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 4px;border-bottom:1px dashed #cdbf9d}
.row span{flex:1 1 280px}
.bar{height:10px;background:#e7dcc3;border-radius:6px;overflow:hidden;margin-bottom:10px}.bar i{display:block;height:100%;background:var(--v)}
li{margin:4px 0}small{color:#5b6785}
.pin{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--n);color:#fff;font-size:14px;border:2px solid var(--g)}
.mp{position:relative;margin:8px 0}.mp img{width:100%;display:block;border-radius:8px}.mp .pin{position:absolute;transform:translate(-50%,-50%)}
.doc{max-width:100%;max-height:270px;border-radius:8px;display:block;margin:8px 0}.th{height:110px;border-radius:8px;vertical-align:middle;margin-right:8px}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
@media print{.path,.noprint{display:none}body{background:#fff}}
</style></head><body>

const TRI=[["hache","Doc. 1 : hache de Saint-Didier","Néolithique"],["silex","Doc. 2 : outils de la grotte Cottier","Paléolithique"],["vase","Doc. 3 : vase décoré","Néolithique"],["aiguille","Doc. 4 : aiguille à chas","Paléolithique"],["statue","Doc. 5 : statue-menhir de Veyre-Menton","Néolithique"],["batons","Doc. 6 : bâtons percés de Polignac","Paléolithique"],["mega","Doc. 7 : blocs de pierre de Saint-Didier","Néolithique"],["outils","Doc. 8 : outils de Polignac","Paléolithique"],["dents","Doc. 9 : dents de chevaux de la grotte Cottier","Paléolithique"],["tumulus","Doc. 10 : mégalithe de Veyre-Menton vu du ciel","Néolithique"]].map(r=>[IM(r[0],r[1])+r[1],r[2]]);
TRI.O=["Paléolithique","Néolithique"];
const OBS=[{img:IMG.hache,q:"Cet objet a été trouvé à Saint-Didier. Que peut-on dire ?",o:["C’est une hache polie : un outil du Néolithique","C’est un silex taillé du Paléolithique","C’est une aiguille en os du Paléolithique","C’est un outil de chasse en bois de renne"],a:0,e:"La pierre polie caractérise le Néolithique ; la hache permet de défricher."},
{img:IMG.aiguille,q:"Cette aiguille à chas en os date du Paléolithique. À quoi servait-elle ?",o:["À coudre des vêtements en peau","À tisser du textile","À moudre le blé","À peindre les parois des grottes"],a:0,e:"Au Paléolithique, on s’habille de peaux d’animaux que l’on coud."},
{img:IMG.vase,q:"Observe ce vase décoré. Que peut-on en déduire ?",o:["Des artisans fabriquent des poteries pour stocker et transporter","Les humains sont nomades et ne possèdent presque rien","Il a été peint dans la grotte de Lascaux","Il date des premiers Homo habilis"],a:0,e:"Poteries et jarres sont fabriquées par des artisans : elles servent à stocker et transporter le blé."},
{img:IMG.outils,q:"Ces silex taillés viennent de la vallée du Rhône, loin du site de fouille. Que peut-on en déduire ?",o:["Les humains se déplaçaient beaucoup : ils étaient nomades","Ils vivaient dans de grands villages","Ils pratiquaient l’agriculture","Ils avaient inventé l’écriture"],a:0,e:"Des silex venus d’autres régions prouvent que les humains du Paléolithique sont nomades."},
{img:IMG.mega,q:"Ces blocs de pierre se trouvent à Saint-Didier (Haute-Loire). De quoi s’agit-il ?",o:["De mégalithes construits au Néolithique","D’une grotte ornée du Paléolithique","D’un silo à blé","D’un campement de nomades"],a:0,e:"Un mégalithe est un monument fait de gros blocs de pierre : il exprime des croyances et le pouvoir de chefs."},
{img:IMG.batons,q:"Ces bâtons percés de Polignac sont en bois de renne. Que nous apprend ce matériau ?",o:["Les humains utilisent le bois et l’os des animaux chassés ; le climat est froid","Les humains élèvent des rennes dans des fermes","Ces bâtons datent du Néolithique","Ces bâtons servaient à tisser"],a:0,e:"Au Paléolithique, on fabrique outils et objets en pierre, os et bois ; le renne vit dans un climat froid."},
{img:IMG.hache,q:"À quoi servait une hache comme celle-ci ?",o:["À défricher des terres pour les cultiver","À moissonner le blé","À peindre une grotte","À coudre des peaux"],a:0,e:"La hache permet de défricher ; la faucille sert à récolter le blé."},
{img:IMG.vase,q:"À quoi pouvait servir ce vase ?",o:["À stocker ou transporter des aliments, comme le blé","À chasser le renne","À creuser une tombe","À écrire"],a:0,e:"Les jarres permettent de stocker et de transporter le blé."},
{img:IMG.statue,q:"Cette statue-menhir vient de Veyre-Menton. À quelle période l’associer ?",o:["Au Néolithique : c’est un mégalithe","Au Paléolithique : c’est une peinture de grotte","Au début de l’Histoire : elle porte de l’écriture","À l’époque d’Homo habilis"],a:0,e:"Menhirs, dolmens et statues-menhirs sont des mégalithes néolithiques."},
{img:IMG.silex,q:"Ces grattoirs, perçoirs et burins sont en silex taillé. À quoi les relier ?",o:["Au Paléolithique : des chasseurs-cueilleurs nomades","Au Néolithique : des paysans sédentaires","Au Néolithique : des potiers","À l’époque de l’écriture"],a:0,e:"La pierre taillée caractérise le Paléolithique."}];
const ST=[{t:"Quiz",i:"🧭",m:14,run:()=>qcm(sh(Q1).slice(0,7))},{t:"Vrai ou faux",i:"⚖️",m:12,run:()=>qcm(sh(VF).slice(0,6))},{t:"Frise",i:"⏳",m:6,run:order},{t:"Vocabulaire",i:"📖",m:7,run:()=>assign(pk(VOC,7),"Associe chaque définition au bon mot.")},{t:"Cartes",i:"🗺️",m:5,run:()=>assign(pk(ESP,5),"Situe dans l’espace : choisis la bonne région.")},{t:"Paléo / Néo",i:"🪨",m:8,run:()=>assign(pk(PN,8),"Paléolithique ou Néolithique ?")},{t:"Carte à légender",i:"📍",m:7,run:()=>assign(CAR,"Observe la carte : associe chaque repère à la bonne région, puis complète la légende (A et B).")},{t:"Observer",i:"🔎",m:12,run:()=>qcm(sh(OBS).slice(0,6))},{t:"Tri d’images",i:"🖼️",m:8,run:()=>assign(pk(TRI,8),"Observe chaque document : Paléolithique ou Néolithique ?")},{t:"Argumenter",i:"✍️",m:10,run:txt}];
const TIP=["Relis le I) et les fouilles du Puy-en-Velay","Relis les I) A et B et le II) B","Refais la frise chronologique p. 17","Revois le vocabulaire (p. 28, 33, 36)","Refais les cartes p. 22-23 et p. 35","Reprends le tableau de conclusion p. 38","Revois la carte p. 23 : continents, rond et flèche de la légende","Observe un objet : matière, usage, période, ce qu’il nous apprend","Compare outils et monuments : taillée ou polie, nomade ou sédentaire","Entraîne-toi à rédiger : thèse, arguments, exemple, conclusion"];
let sc=[],cur=0,name="";
function nav(){$("#path").innerHTML=ST.map((s,i)=>`<div class="stp ${i==cur?"on":""} ${sc[i]!=null?"ok":""}">${s.i}<br>${s.t}${sc[i]!=null?`<br>${sc[i]}/${s.m}`:""}</div>`).join("")}
function home(){sc=[];cur=-1;nav();$("#st").innerHTML=`<h1>Révisions : les débuts de l’humanité</h1><p>10 étapes pour te préparer à l’évaluation : quiz, vrai ou faux, frise, vocabulaire, cartes, documents à observer… et pour finir, un texte à écrire que le site analysera. Les questions sont tirées au sort : en recommençant, tu en auras de nouvelles. Compte quarante minutes.</p><p><label>Ton prénom : <input id="nm" maxlength="30"></label></p><button class="pri" id="go">C’est parti !</button>`;$("#go").onclick=()=>{name=$("#nm").value.trim()||"Élève";go(0)}}
function go(i){cur=i;nav();$("#st").innerHTML=`<h2>${ST[i].i} Étape ${i+1} : ${ST[i].t}</h2><div id="b"></div>`;ST[i].run();scrollTo(0,0)}
function fin(s){sc[cur]=s;nav();const m=ST[cur].m;$("#b").insertAdjacentHTML("beforeend",`<p><b>Score : ${s}/${m}</b> ${s>=m*.8?"🎉":"💪"}</p><button class="pri" id="nx">${cur<ST.length-1?"Étape suivante":"Voir mon bilan"}</button>`);$("#nx").onclick=()=>cur<ST.length-1?go(cur+1):bilan()}
function qcm(I){let i=0,s=0;const b=$("#b");(function q(){const x=I[i],P=x.o.map((_,k)=>k);if(P.length>2)P.sort(()=>Math.random()-.5);b.innerHTML=`<div class="bar"><i style="width:${i/I.length*100}%"></i></div><p><b>${i+1}/${I.length}</b> ${x.q}</p>${x.img?`<img class="doc" src="${x.img}" alt="Document à observer">`:""}`+P.map(k=>`<button class="opt" data-k="${k}">${x.o[k]}</button>`).join("")+`<div id="ex"></div>`;
b.querySelectorAll(".opt").forEach(bt=>bt.onclick=()=>{const ok=+bt.dataset.k==x.a;if(ok)s+=2;b.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.k==x.a)o.classList.add("good")});if(!ok)bt.classList.add("bad");$("#ex").innerHTML=`<p>${ok?"✅ Bravo !":"❌ Pas tout à fait."} ${x.e}</p><button class="pri" id="n2">Suite</button>`;$("#n2").onclick=()=>{++i<I.length?q():(b.innerHTML="",fin(s))}})})()}
function order(){const b=$("#b"),ix=sh(FR.map((_,i)=>i)).slice(0,6).sort((a,b)=>a-b),n=6;let k=0,e=0;b.innerHTML=`<p>Clique sur les événements dans l’ordre, du plus ancien au plus récent. Chaque erreur te coûte un point.</p><div id="ch"></div><ol id="tl"></ol><p id="m"></p>`;
$("#ch").innerHTML=sh(ix.map(i=>[FR[i],i])).map(([t,i])=>`<button data-i="${i}">${t}</button>`).join("");
$("#ch").onclick=ev=>{const bt=ev.target.closest("button");if(!bt)return;if(+bt.dataset.i==ix[k]){$("#tl").insertAdjacentHTML("beforeend",`<li>${FR[ix[k]]} <small>${DT[ix[k]]}</small></li>`);bt.remove();k++;$("#m").textContent="✅ Bien vu !";if(k==n){$("#ch").onclick=null;fin(Math.max(0,n-e))}}else{e++;$("#m").textContent="❌ Ce n’est pas le prochain événement, réfléchis encore."}}}
function assign(R,m){const b=$("#b");b.innerHTML=`<p>${m}</p>${R.pre||""}`+R.map((r,i)=>`<div class="row"><span>${r[0]}</span><select id="a${i}"><option value="">Choisis…</option>${(r[2]||R.O).map(o=>`<option>${o}</option>`).join("")}</select></div>`).join("")+`<button class="pri" id="vr">Vérifier</button>`;
$("#vr").onclick=()=>{let s=0;R.forEach((r,i)=>{const e=$("#a"+i),ok=e.value==r[1];if(ok)s++;e.disabled=true;e.parentNode.classList.add(ok?"good":"bad");if(!ok)e.insertAdjacentHTML("afterend",`<b>→ ${r[1]}</b>`)});$("#vr").remove();fin(s)}}
function txt(){const b=$("#b"),TZ=sh(TQ).slice(0,3);b.innerHTML=`<p>Choisis une question de cours, puis réponds en 5 à 8 lignes : donne ta position, au moins deux arguments précis, un exemple et une conclusion. Tu peux t’analyser, corriger, puis recommencer.</p><select id="tq">${TZ.map((x,i)=>`<option value="${i}">${x.q}</option>`).join("")}</select><textarea id="tx" placeholder="Écris ton texte ici…"></textarea><button class="pri" id="an">Analyser mon texte</button><div id="fb"></div>`;
$("#an").onclick=()=>{const T=$("#tx").value.trim(),Q=TZ[$("#tq").value],w=(T.match(/\S+/g)||[]).length;if(w<8){$("#fb").innerHTML="<p>✏️ Écris quelques phrases avant de lancer l’analyse.</p>";return}
const ok=[],ko=[],hit=Q.k.filter(k=>k[0].test(T)),miss=Q.k.filter(k=>!k[0].test(T));let s=Math.min(5,hit.length);
hit.length?ok.push(`Connaissances présentes : ${hit.map(h=>h[1]).join(" ; ")}.`):0;
miss.length&&hit.length<4?ko.push(`Il manque des connaissances du cours, par exemple : ${miss.slice(0,2).map(h=>h[1]).join(" ; ")}.`):0;
const t=(re,y,n)=>{if(re.test(T)){s++;ok.push(y)}else ko.push(n)};
t(/je (pense|crois)|à mon avis|selon moi|\boui\b|\bnon\b|on peut dire|on dit que/i,"Tu prends position clairement.","Prends position dès le début (« Je pense que… », « Oui, car… »).");
if((T.match(/\b(d’abord|d'abord|ensuite|enfin|de plus|en effet|car|parce que|puis|premièrement|deuxièmement|également)\b/gi)||[]).length>=2){s++;ok.push("Tes idées sont reliées par des connecteurs (car, ensuite, de plus…).")}else ko.push("Relie tes arguments avec des connecteurs : d’abord, ensuite, de plus, car, enfin.");
t(/par exemple|notamment|comme /i,"Tu donnes un exemple.","Ajoute un exemple précis (« par exemple, la hache polie permet de défricher »).");
t(/donc|en conclusion|pour conclure|en résumé|finalement|c’est pourquoi|c'est pourquoi/i,"Tu conclus ton texte.","Termine par une conclusion (« Pour conclure… », « C’est pourquoi… »).");
t(w>=35?/./:/^$/,"La longueur est suffisante.","Ton texte est trop court : développe au moins deux arguments (35 mots minimum).");
Q.w.forEach(x=>{if(x[0].test(T)){s--;ko.push("⚠️ Erreur possible : "+x[1])}});
if(!/^[A-ZÉÈÀÂÊÎÔÛÇ]/.test(T)||!/[.!?»]\s*$/.test(T))ko.push("Pense à la majuscule au début et au point final.");
s=Math.max(0,Math.min(10,s));
$("#fb").innerHTML=`<h3>Ton texte : ${s}/10</h3><p><b>👍 Ce qui va</b></p><ul>${ok.map(x=>`<li>${x}</li>`).join("")||"<li>Pas encore de point fort repéré, relis le cours !</li>"}</ul><p><b>🔧 À améliorer</b></p><ul>${ko.map(x=>`<li>${x}</li>`).join("")||"<li>Rien à signaler, bravo !</li>"}</ul><p><small>L’analyse repose sur des mots-clés : ton professeur lira aussi ton texte.</small></p><button class="pri" id="ft">Terminer avec ce texte</button>`;
$("#ft").onclick=()=>{$("#an").remove();$("#ft").remove();$("#tx").readOnly=true;fin(s)}}}
function bilan(){const tot=sc.reduce((a,b)=>a+b,0),mx=ST.reduce((a,s)=>a+s.m,0),p=tot/mx,n=Math.round(p*200)/10,bd=p>=.9?"🏆 Archéologue en chef":p>=.7?"⛏️ Fouilleur confirmé":p>=.5?"🔍 Apprenti archéologue":"🦴 À reprendre pas à pas";
const rev=ST.map((s,i)=>sc[i]<s.m*.7?`<li>${s.i} ${s.t} : ${TIP[i]}</li>`:"").join("");
const res=`${name} – Révisions Préhistoire : ${tot}/${mx} (${n}/20) | `+ST.map((s,i)=>`${s.t} ${sc[i]}/${s.m}`).join(", ");
cur=-1;nav();$("#st").innerHTML=`<h2>Bravo ${name} !</h2><h1>${bd}</h1><p><b>${tot}/${mx} points</b> (soit ${n}/20)</p>`+ST.map((s,i)=>`<div>${s.i} ${s.t} : ${sc[i]}/${s.m}<div class="bar"><i style="width:${sc[i]/s.m*100}%"></i></div></div>`).join("")+(rev?`<h3>À retravailler</h3><ul>${rev}</ul>`:"<p>🎉 Aucune étape à retravailler !</p>")+`<p class="noprint"><button class="pri" id="cp">Copier mon résultat</button><button id="pr">Imprimer</button><button id="rs">Recommencer</button></p>`;
$("#cp").onclick=()=>{try{navigator.clipboard.writeText(res).then(()=>$("#cp").textContent="Copié ✅")}catch(e){prompt("Copie ton résultat :",res)}};$("#pr").onclick=()=>print();$("#rs").onclick=home}
home();
</script></body></html>
